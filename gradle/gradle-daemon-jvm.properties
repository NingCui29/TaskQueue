# ---------------------------------------------------------------------------
# Daemon JVM criteria（Gradle 8.8+ 孵化特性）
#
# 固定构建守护进程运行的 JDK 主版本，不依赖各机器的 JAVA_HOME。
#
# 为什么钉 17：Gradle 8.13 的支持上限是 JDK 23，本机 JAVA_HOME 指向 JDK 24。
# 本工程是纯 Kotlin/JVM，不涉及 AndroidUnitTest，因此不像源工程那样会出现
# 测试任务静默不创建的问题；钉版本只为构建结果可复现，并与源工程保持一致。
# 17 同时是本工程 sourceCompatibility / jvmTarget 的目标版本。
# ---------------------------------------------------------------------------
toolchainVersion=17
