name: 持续集成

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建、测试与打包
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码
        # 官方版本：https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        # 官方版本：https://github.com/actions/setup-java/releases/tag/v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建并生成发布包
        run: ./gradlew build releaseBundle --no-build-cache --console=plain

      - name: 上传发布产物
        # 官方版本：https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: taskqueue-release
          path: build/release/*
          if-no-files-found: error

      - name: 失败时上传测试报告
        if: failure()
        # 官方版本：https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: taskqueue-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
